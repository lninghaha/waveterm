# Build unsigned Windows x64 NSIS installer for the zh-CN soft-fork.
# Uploads the .exe as a workflow artifact and, on tags, attaches it to the GitHub Release.

name: Build Windows x64
run-name: Windows x64 ${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && ' (manual)' || '' }}

on:
    push:
        tags:
            - "v*-zhCN*"
            - "v*-zhcn*"
    workflow_dispatch:
        inputs:
            upload_to_release:
                description: "Attach .exe to an existing GitHub Release for this ref (tag only)"
                type: boolean
                default: true

env:
    GO_VERSION: "1.25.6"
    NODE_VERSION: 22
    NODE_OPTIONS: --max-old-space-size=4096

permissions:
    contents: write

jobs:
    build-windows-x64:
        name: Build NSIS installer (x64)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-go@v6
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: |
                      go.sum

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Force git deps to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:

            - uses: nick-fields/retry@v4
              name: npm ci
              with:
                  command: npm ci --no-audit --no-fund
                  retry_on: error
                  max_attempts: 3
                  timeout_minutes: 5
              env:
                  GIT_ASKPASS: "echo"
                  GIT_TERMINAL_PROMPT: "0"

            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Zig
              uses: mlugg/setup-zig@v2

            - name: Install FPM
              run: gem install fpm

            - name: Build Windows x64 NSIS
              run: task package -- --win nsis --x64
              env:
                  USE_SYSTEM_FPM: true
                  # Fork has no DigiCert / Authenticode secrets; unsigned installer is fine for self-use.
                  CSC_IDENTITY_AUTO_DISCOVERY: false
              shell: powershell

            - name: List make/ artifacts
              run: Get-ChildItem -Path make -ErrorAction SilentlyContinue | Format-Table Name, Length
              shell: powershell

            - name: Upload .exe artifact
              uses: actions/upload-artifact@v5
              with:
                  name: windows-x64-nsis
                  path: make/*.exe
                  if-no-files-found: error

            - name: Attach .exe to GitHub Release
              if: >
                  startsWith(github.ref, 'refs/tags/') &&
                  (github.event_name == 'push' || inputs.upload_to_release)
              uses: softprops/action-gh-release@v2
              with:
                  files: make/*.exe
                  fail_on_unmatched_files: true
