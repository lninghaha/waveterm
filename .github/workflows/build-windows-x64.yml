# Build unsigned Windows x64 NSIS installer for the zh-CN soft-fork.
# Uploads the .exe as a workflow artifact and attaches it to a GitHub Release when possible.

name: Build Windows x64
run-name: Windows x64 ${{ inputs.release_tag || github.ref_name }}${{ github.event_name == 'workflow_dispatch' && ' (manual)' || '' }}

on:
    push:
        tags:
            - "v*-zhCN*"
            - "v*-zhcn*"
    workflow_dispatch:
        inputs:
            release_tag:
                description: "Optional existing release tag to attach the .exe to (e.g. v0.14.5-zhCN.1). Leave empty to only upload an Actions artifact."
                type: string
                required: false
                default: ""

env:
    GO_VERSION: "1.25.6"
    NODE_VERSION: 22
    NODE_OPTIONS: --max-old-space-size=4096

permissions:
    contents: write

jobs:
    build-windows-x64:
        name: Build NSIS installer (x64)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-go@v6
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: |
                      go.sum

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Force git deps to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:

            - uses: nick-fields/retry@v4
              name: npm ci
              with:
                  command: npm ci --no-audit --no-fund
                  retry_on: error
                  max_attempts: 3
                  timeout_minutes: 5
              env:
                  GIT_ASKPASS: "echo"
                  GIT_TERMINAL_PROMPT: "0"

            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Zig
              uses: mlugg/setup-zig@v2

            - name: Install FPM
              run: gem install fpm

            - name: Build Windows x64 NSIS + portable
              run: task package -- --win nsis portable --x64
              env:
                  USE_SYSTEM_FPM: true
                  # Fork has no DigiCert / Authenticode secrets; unsigned installer is fine for self-use.
                  CSC_IDENTITY_AUTO_DISCOVERY: false
              shell: powershell

            - name: List make/ artifacts
              run: Get-ChildItem -Path make -ErrorAction SilentlyContinue | Format-Table Name, Length
              shell: powershell

            - name: Upload Windows artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: windows-x64
                  path: |
                      make/*.exe
                  if-no-files-found: error

            - name: Attach artifacts to GitHub Release (tag push)
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  files: make/*.exe
                  fail_on_unmatched_files: true

            - name: Attach artifacts to GitHub Release (manual tag)
              if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.release_tag }}
                  files: make/*.exe
                  fail_on_unmatched_files: true
